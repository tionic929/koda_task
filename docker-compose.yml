services:
  backend:
    build: ./backend
    container_name: koda_task_backend
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - DATABASE_URL=file:/data/dev.db
      - JWT_SECRET=kodatask-docker-secret-key
    volumes:
      - sqlite_data:/data

  frontend:
    build: ./frontend
    container_name: koda_task_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  sqlite_data:
